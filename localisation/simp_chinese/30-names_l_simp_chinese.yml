# ── 战术卡（tactical-ai tactic.rs）──
tactic.blitz.name:0 "闪击战"
tactic.blitz.desc:0 "纵深突破：装甲部队沿狭窄正面高速突进、绕过坚固据点；摩托化部队随后跟进扩大突破口。"
tactic.blitz.hint:0 "被弹性防御克制"
tactic.elastic_defense.name:0 "弹性防御"
tactic.elastic_defense.desc:0 "迟滞与保存实力：受攻击时主动后撤，只反击孤立的敌军单位。"
tactic.elastic_defense.hint:0 "克制闪击战"
tactic.overwhelming_fire.name:0 "压倒性火力"
tactic.overwhelming_fire.desc:0 "消耗战：全部炮兵集中轰击最薄弱的格子，步兵战线原地固守。"
tactic.overwhelming_fire.hint:0 "克制人海冲锋"
tactic.infiltration_assault.name:0 "渗透突击"
tactic.infiltration_assault.desc:0 "钻隙突进：侦察单位试探两翼；步兵集中攻击防守薄弱的格子，避开坚固阵地。"
tactic.infiltration_assault.hint:0 "无直接克制"
tactic.mass_charge.name:0 "人海冲锋"
tactic.mass_charge.desc:0 "全面正面突击：所有步兵一齐推进，每回合最多一格。对伤亡容忍度极高。"
tactic.mass_charge.hint:0 "被压倒性火力克制"
tactic.guerrilla_tactics.name:0 "游击战术"
tactic.guerrilla_tactics.desc:0 "打了就跑：攻击后立即脱离——回合结束时绝不与敌军相邻。"
tactic.guerrilla_tactics.hint:0 "无直接克制"
tactic.tactical_withdrawal.name:0 "战术撤退"
tactic.tactical_withdrawal.desc:0 "系统性撤退：在后卫掩护下每回合向后方撤退一格。"
tactic.tactical_withdrawal.hint:0 "克制合围"
tactic.encirclement.name:0 "合围"
tactic.encirclement.desc:0 "钳形攻势：装甲部队绕袭两翼，步兵钉住中央。"
tactic.encirclement.hint:0 "被战术撤退克制"
tactic.default.name:0 "默认"
tactic.default.desc:0 "固守并接战最近的敌人；受损单位轮换到后方。"
tactic.default.hint:0 "无克制关系"
tactic.counterattack.name:0 "反击"
tactic.counterattack.desc:0 "防御反击：坚守战线，但对孤立或受创的敌军猛烈反击并守住夺取的阵地。"
tactic.counterattack.hint:0 "克制强攻"
tactic.ambush.name:0 "伏击"
tactic.ambush.desc:0 "伏击：绝不移动，潜伏于掩体中，只攻击踏入相邻格的敌人。"
tactic.ambush.hint:0 "克制震慑"
tactic.river_defense.name:0 "江河防御"
tactic.river_defense.desc:0 "江河防线：不惜一切坚守河岸——绝不撤退，渡河至半的敌军遭受双倍打击。"
tactic.river_defense.hint:0 "克制强渡江河"
tactic.urban_defense.name:0 "城市防御"
tactic.urban_defense.desc:0 "巷战：驻守城市，绝不离开，迎战每一个进入的敌人。"
tactic.urban_defense.hint:0 "无直接克制"
tactic.delay.name:0 "迟滞"
tactic.delay.desc:0 "机动迟滞：把敌军保持在 2–3 格的接触带上，以持续火力和逐次抵抗消耗对方。"
tactic.delay.hint:0 "被震慑克制"
tactic.assault.name:0 "强攻"
tactic.assault.desc:0 "标准突击：炮兵先轰击最薄弱的格子，步兵战线齐步推进，接敌即突击。"
tactic.assault.hint:0 "被反击克制"
tactic.river_assault.name:0 "强渡江河"
tactic.river_assault.desc:0 "强渡作战：炮兵猛轰渡口，步兵强行渡河并固守对岸。"
tactic.river_assault.hint:0 "被江河防御克制"

