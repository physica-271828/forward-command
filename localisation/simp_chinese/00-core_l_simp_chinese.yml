menu.settings.render_scale:0 "渲染比例"
menu.tooltip.msaa:0 "4×/2×/关——高分辨率屏降低档位可省显存；改动立即生效，战斗中也可调整（Esc → 设置）"
menu.tooltip.shadow:0 "关/低(1024，简化采样)/高(2048)——关闭则完全不渲染阴影；低档同时减半阴影通道开销。主界面场景静止，阴影最高只按低档渲染"
menu.tooltip.render_scale:0 "100%/85%/70%/50%——低于 100% 时 3D 场景以更低分辨率渲染再放大到窗口，是低配 GPU 上单项最大的帧率提升，画面略变软。改动立即生效，战斗中也可调整（Esc → 设置）"
menu.tooltip.max_fps:0 "限制战斗窗口的渲染帧率；回合制战棋 60 帧足够，高刷屏上可大幅降低 GPU 占用；选「不限」则全速渲染。主界面帧率由下一行单独限制"
menu.tooltip.menu_fps:0 "限制主界面旋转背景的渲染帧率——缓慢环绕（约 140 秒一圈）在 24–30 帧下观感无异；主界面不会空闲降帧，这是它唯一的 GPU 闸门（60 帧时前台约占 30% GPU）"
menu.tooltip.low_power:0 "战斗窗口空闲时降到约 10 fps，有输入立即恢复满速——为并行运行的 HOI4 让出 GPU"
menu.settings.writeback:0 "战损回写"
menu.settings.writeback.org_str:0 "回写（组织度+强度，精确到地块）"
menu.settings.writeback.off:0 "不回写"
menu.settings.writeback.desc:0 "HOI4 无法单独指定某个师承受损耗：回写精度为地块（province）——防守方精确到交战地块（被攻地块内所有师都算参战）；攻方按来源省回写，同省未参战师可能被轻微波及。"
menu.settings.writeback.detail.org_str:0 "双方组织度与强度都回写：防守方精确到交战地块；攻方强度按来源省总量摊到省内所有师（可能轻微波及未参战师）。"
menu.settings.writeback.detail.off:0 "不回写任何战损——战术战斗结果不影响 HOI4 战局（沙盒模式）。"
menu.tooltip.writeback:0 "选择战术战斗的损耗如何回写到 HOI4"
menu.settings.diag:0 "导出诊断包"
menu.settings.diag.include_save:0 "附带最新存档"
menu.settings.diag.done:0 "诊断包已导出：{path}"
menu.settings.diag.failed:0 "导出失败：{error}"
menu.tooltip.diag:0 "一键打包报错所需文件：crash.log + 注入日志 + settings.json + game.log 尾段（勾选时含最新存档），输出在 exe 旁。包内含本机路径，勾选存档时还含你的存档——发送前可先打开查看"
menu.tooltip.diag.include_save:0 "打包最新的 .hoi4 存档——live/注入类问题必须附上；存档较大，导出需要几秒钟"

