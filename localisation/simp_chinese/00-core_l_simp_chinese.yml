menu.about.disclaimer.text:0 "本软件是免费的个人兴趣作品，与 Paradox Interactive 无任何关系——非官方产品，未获其认可或授权；《Hearts of Iron IV》的全部素材与数据版权归 Paradox 所有。\n程序只读取游戏日志与你的存档，通过模拟键盘输入在游戏控制台执行指令来回写战果：不联网、不收集任何数据。杀毒软件可能把这一行为判为敏感操作而误报，使用前请加白名单。\n战果注入虽已做过无残留验证，仍建议先备份存档再游玩。使用风险自负——本软件按「现状」提供，不含任何明示或默示担保。"

