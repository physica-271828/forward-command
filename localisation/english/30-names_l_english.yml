# ── Combat tactics (tactical-ai tactic.rs; English fallback = name()/description()/counter_hint()) ──
tactic.blitz.name:0 "Blitz"
tactic.blitz.desc:0 "Deep penetration: armor rushes a narrow front, bypassing strongpoints; motorized follows to widen the breach."
tactic.blitz.hint:0 "Countered by Elastic Defense"
tactic.elastic_defense.name:0 "Elastic Defense"
tactic.elastic_defense.desc:0 "Delay and preserve: falls back when attacked, counter-attacks only isolated enemy units."
tactic.elastic_defense.hint:0 "Counters Blitz"
tactic.overwhelming_fire.name:0 "Overwhelming Fire"
tactic.overwhelming_fire.desc:0 "Attrition warfare: all artillery concentrates on the weakest hex while the infantry line holds."
tactic.overwhelming_fire.hint:0 "Counters Mass Charge"
tactic.infiltration_assault.name:0 "Infiltration Assault"
tactic.infiltration_assault.desc:0 "Exploit gaps: recon probes the flanks; infantry concentrates on weakly-held hexes, avoiding strong positions."
tactic.infiltration_assault.hint:0 "No direct counter"
tactic.mass_charge.name:0 "Mass Charge"
tactic.mass_charge.desc:0 "Full frontal assault: all infantry advance together, at most one hex per turn. High casualty tolerance."
tactic.mass_charge.hint:0 "Countered by Overwhelming Fire"
tactic.guerrilla_tactics.name:0 "Guerrilla Tactics"
tactic.guerrilla_tactics.desc:0 "Hit and run: strike, then disengage — never ends the turn adjacent to the enemy."
tactic.guerrilla_tactics.hint:0 "No direct counter"
tactic.tactical_withdrawal.name:0 "Tactical Withdrawal"
tactic.tactical_withdrawal.desc:0 "Systematic retreat: falls back one hex per turn toward the rear behind a rearguard."
tactic.tactical_withdrawal.hint:0 "Counters Encirclement"
tactic.encirclement.name:0 "Encirclement"
tactic.encirclement.desc:0 "Pincer movement: armor swings around both flanks while infantry pins the center."
tactic.encirclement.hint:0 "Countered by Tactical Withdrawal"
tactic.default.name:0 "Default"
tactic.default.desc:0 "Hold and engage the nearest enemy; damaged units rotate to the rear."
tactic.default.hint:0 "No counter"
tactic.counterattack.name:0 "Counterattack"
tactic.counterattack.desc:0 "Counter-offensive: holds the line, but strikes hard at an isolated or beaten enemy and keeps the ground."
tactic.counterattack.hint:0 "Counters Assault"
tactic.ambush.name:0 "Ambush"
tactic.ambush.desc:0 "Ambush: never moves, lurks in cover, strikes only an enemy that steps adjacent."
tactic.ambush.hint:0 "Counters Shock"
tactic.river_defense.name:0 "River Defense"
tactic.river_defense.desc:0 "River line: holds the riverbank at all costs — no retreat, enemies caught mid-crossing take double damage."
tactic.river_defense.hint:0 "Counters River Assault"
tactic.urban_defense.name:0 "Urban Defense"
tactic.urban_defense.desc:0 "Street fighting: garrisons the city, never leaves it, fights every enemy that enters."
tactic.urban_defense.hint:0 "No direct counter"
tactic.delay.name:0 "Delay"
tactic.delay.desc:0 "Mobile delay: keeps the enemy in a 2–3 hex contact band with constant fire and stepwise resistance."
tactic.delay.hint:0 "Countered by Shock"
tactic.assault.name:0 "Assault"
tactic.assault.desc:0 "Standard assault: artillery prepares the weakest hex, the infantry line advances in step, assaults on contact."
tactic.assault.hint:0 "Countered by Counterattack"
tactic.river_assault.name:0 "River Assault"
tactic.river_assault.desc:0 "River crossing: artillery pounds the ford, infantry forces the crossing and holds the far bank."
tactic.river_assault.hint:0 "Countered by River Defense"

