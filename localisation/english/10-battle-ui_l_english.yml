# ── Desync guard (DESIGN §3.2/§8.2) ──
battle.desync.title:0 "Cannot Sync"
battle.desync.lead:0 "The strategic world no longer matches this battle — syncing now would write the results into the wrong world."
battle.desync.body.hour:0 "The clock receipt reads {found}, but the next hour after the last sync should be {expected}. This happens when an earlier save was loaded mid-battle, the played country was switched, or the game ran unpaused during the fight."
battle.desync.body.tag:0 "The loaded save is played as {found}, but this battle belongs to {expected}. The country switch breaks every sync channel."
battle.desync.end_battle:0 "End Tactical Battle"
battle.desync.continue:0 "Continue Unsynced"
battle.desync.status:0 "DESYNCED — unsynced mode (results no longer written to HOI4)"
battle.tooltip.sync_disabled:0 "Sync disabled: this battle is desynced from HOI4. End the battle or keep fighting unsynced — exits will only clean up HOI4's frozen state."

# ── Turn automation (session-scoped battle-window toggles, DESIGN §6.2/§8.2) ──
battle.auto.title:0 "Automation"
battle.auto.fast:0 "RTS Mode (Test)"
battle.auto.fast.paused:0 "Paused (Space to resume)"
battle.auto.speed_label:0 "Advance speed"
battle.auto.skip_quiet:0 "Auto-skip quiet turns"
battle.auto.skip_reports:0 "Auto-close reports"
battle.auto.auto_sync:0 "Auto-sync at hour end"
battle.auto.report_close_label:0 "Report auto-close delay"
battle.auto.sync_close_label:0 "Sync summary auto-close delay"
battle.tooltip.auto.fast:0 "Experimental mode, still immature (the Test tag goes once it settles): one-click RTS-style auto play — all three automations below run by themselves at the pace set by the speed slider, combat reports never pop up (outcomes still land in the battle log), and hour-boundary syncs fire by themselves. Space pauses/resumes — the board stays fully usable for orders while paused. Unchecking restores your previous settings below."
battle.tooltip.auto.speed:0 "How fast RTS mode rolls: 1.0× is the default pace — raise to speed up, lower to slow down (the auto End Turn and hour-boundary sync waits scale together)."
battle.tooltip.auto.skip_quiet:0 "Rounds with no fire/assault settlement end themselves — pure marching and no-action turns roll on. A round that saw combat pauses the advance here (this toggle stays on); end that turn by hand once and the skipping resumes. Halts with a notice after 12 rounds with no movement and no combat."
battle.tooltip.auto.skip_reports:0 "Each round's combat-report window closes itself after the delay below, no Continue needed. Battle-end reports always wait for manual closing."
battle.tooltip.auto.auto_sync:0 "The hour-boundary Sync runs by itself; the summary closes after its own delay (with auto-advance on, closing it resumes the skipping)."
battle.tooltip.auto.report_close_secs:0 "How long a combat report stays on screen before closing itself."
battle.tooltip.auto.sync_close_secs:0 "How long the sync summary stays up before closing itself."
battle.manual.keep:0 "Keep command"
battle.tooltip.manual.keep.checked:0 "Keep manual: after a manual order completes (arrival / attack resolution) the battalion does not return automatically — it stays under manual command, the division AI never takes it over and it takes no part in division-order planning, until stood by (right-click the battalion itself)."
battle.tooltip.manual.keep.unchecked:0 "Return when done (default): after a manual order completes, the battalion returns to its division at the turn rollover and rejoins division-order planning; the battle log announces the hand-back."
battle.notice.auto.fuse:0 "{n} rounds with no movement and no combat — auto-advance halted"
battle.notice.auto.paused:0 "Auto play paused (Space to resume)"
battle.notice.auto.resumed:0 "Auto play resumed"
battle.notice.advance_all.none:0 "Advance All: no division is waiting for an order"

