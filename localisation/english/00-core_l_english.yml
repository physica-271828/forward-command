menu.settings.shadow:0 "Shadows"
menu.settings.shadow.off:0 "Off"
menu.settings.shadow.low:0 "Low"
menu.settings.shadow.high:0 "High"
menu.settings.max_fps:0 "Frame-rate cap"
menu.settings.max_fps.uncapped:0 "Uncapped"
menu.settings.menu_fps:0 "Menu frame rate"
menu.settings.low_power:0 "Idle frame-saver (battles)"
menu.settings.render_scale:0 "Render scale"
menu.tooltip.msaa:0 "4×/2×/off — a lower setting frees VRAM on high-resolution displays; changes apply immediately, in battles too (Esc → Settings)"
menu.tooltip.shadow:0 "Off / Low (1024, simplified sampling) / High (2048) — Off skips the shadow pass entirely; Low also halves the shadow-pass draw cost. The menu renders shadows at Low at most (its scene never moves)"
menu.tooltip.render_scale:0 "100%/85%/70%/50% — below 100% the 3D scene renders at a lower resolution and upscales to the window: the single biggest frame-rate win on weak GPUs, at a slight sharpness cost. Changes apply immediately, in battles too (Esc → Settings)"
menu.tooltip.max_fps:0 "Caps battle-window rendering. 60 is plenty for a turn-based wargame and cuts GPU use hard on high-refresh displays; Uncapped = render flat out. The menu has its own cap below"
menu.tooltip.menu_fps:0 "Caps the main menu's orbiting backdrop — a slow cinematic (one revolution ≈140 s) that reads the same at 24–30 fps. The menu never idle-throttles, so this is its only GPU lever (≈30% GPU at 60)"
menu.tooltip.low_power:0 "Battle windows redraw on input and tick at ~10 fps when idle — frees the GPU for HOI4 running alongside"
menu.settings.writeback:0 "Losses write-back"
menu.settings.writeback.org_str:0 "On (org + strength, province-exact)"
menu.settings.writeback.off:0 "Off"
menu.settings.writeback.desc:0 "HOI4 cannot single out a specific division: write-back precision is the province — defender losses land exactly on the contested province (every division there defends it); attacker losses apply per source province and may slightly touch non-participant divisions there."
menu.settings.writeback.detail.org_str:0 "Both org and strength are written back; defender losses are exact to the contested province, attacker strength spreads across every division in each source province (slight collateral to non-participants)."
menu.settings.writeback.detail.off:0 "Nothing is written back — the tactical battle leaves your HOI4 campaign untouched (sandbox mode)."
menu.tooltip.writeback:0 "How tactical battle losses are written back into HOI4"
menu.settings.diag:0 "Export diagnostic bundle"
menu.settings.diag.include_save:0 "Include latest save"
menu.settings.diag.done:0 "Diagnostic bundle written: {path}"
menu.settings.diag.failed:0 "Export failed: {error}"
menu.tooltip.diag:0 "One-click zip for bug reports: crash.log + injection log + settings.json + game.log tail (+ latest save when checked). Written next to the exe. It contains local paths — and your save when checked — so look inside before sharing"
menu.tooltip.diag.include_save:0 "Attach the newest .hoi4 save — required for live/injection bug reports. Saves are large: the export takes a few seconds"

# --- About page ---
menu.about.title:0 "About"
menu.about.version:0 "Forward Command  v{version}"
menu.about.build:0 "Build date: {date}"
menu.about.author:0 "Author: physica"
menu.about.thanks_ai:0 "AI collaboration: Kimi K3 · DeepSeek V4"
menu.about.thanks_assets:0 "Icons: Twemoji (CC-BY 4.0) · Fonts: Noto Sans CJK (OFL) — see assets/ATTRIBUTION.md"
menu.about.disclaimer:0 "Disclaimer"
menu.about.disclaimer.text:0 "This software is a free personal hobby project. It is not affiliated with Paradox Interactive, is not an official product, and is not endorsed or authorized by it — Hearts of Iron IV and all its assets remain the property of Paradox Interactive.\nThe program only reads the game log and your save files, writing results back by simulating keystrokes in the game's console. No network access, no data collection. Antivirus software may flag this behavior as suspicious — add an exclusion before use.\nInjection has been verified to leave no residue, but back up your saves before playing anyway. Use at your own risk: the software is provided \"as is\", without warranty of any kind."

