# --- Button tooltips: hover help; the labels stay short ---
menu.tooltip.live_listen:0 "Tail HOI4's game.log and open a tactical battle when the mod fires one (the menu hides to the tray while a battle runs)"
menu.tooltip.debug_battle:0 "Practice battle without HOI4 — preset forces, a real save, or a script file"
menu.tooltip.settings:0 "HOI4 install/save/log paths, text-save check, language"
menu.tooltip.about:0 "Version, build date and credits"
menu.tooltip.exit_game:0 "Minimize to the system tray or quit"
menu.tooltip.exit_minimize:0 "Hide the window — Forward Command keeps running in the system tray"
menu.tooltip.exit_quit:0 "Quit completely (a running battle window is closed first)"
menu.tooltip.browse:0 "Pick with the system file dialog"
menu.tooltip.fix_binary:0 "Edit HOI4's settings.txt to save_as_binary=no — tactical battles need text saves"
menu.tooltip.save:0 "Write settings.json (paths and language)"
menu.tooltip.manual:0 "Configure the battle by hand: map, forces, enemy tactic"
menu.tooltip.script:0 "Run a scripted battle from data/battles/*.json"
menu.tooltip.nation_player:0 "Your divisions of this nation are commanded directly by you"
menu.tooltip.nation_ai:0 "This nation's divisions fight as allied AI with their own planner (suggested deployment + division orders still available)"
menu.tooltip.arena:0 "Built-in synthetic arena (flat 64×64) — no HOI4 install needed"
menu.tooltip.province:0 "True-scale map from a real HOI4 province id + attack directions (e.g. 306, E,NE)"
menu.tooltip.enemy_tactic:0 "The combat doctrine the enemy AI fights with"
menu.tooltip.attacker:0 "You command the attacking side"
menu.tooltip.defender:0 "You command the defending side"
menu.tooltip.start_battle:0 "Launch the battle in a separate window"

