log.order.retreat_multi:0 "{n} батальон(а) начинают боевой отход"
log.order.take_manual_multi:0 "{n} батальон(а) под ручным управлением"
log.order.take_manual_div_multi:0 "{n} батальон(а) под ручным управлением — ИИ дивизии больше не управляет"
log.order.stand_by_multi:0 "{n} батальон(а) в ожидании — приказы отменены"
log.order.stand_by_div_multi:0 "{n} батальон(а) в ожидании — приказы отменены, возвращены под управление ИИ дивизии"
log.group.saved:0 "Контрольная группа {slot} назначена: {n} батальон(а)"

# ── Rejection reasons (shared by the battle log AND the orange floaters) ──
reject.shocked:0 "Подавлен — не может атаковать"
reject.already_acted:0 "Уже действовал"
reject.emplace_first:0 "Сначала развернуть"
reject.too_close:0 "Слишком близко"
reject.out_of_range:0 "Вне дальности"
reject.holding:0 "Удерживает позицию"
reject.emplaced:0 "Развёрнут — сначала свернуть"
