# ── Notice-bar flashes ──
notice.turn.yours:0 "Ход {n} — ваш ход"
notice.turn.enemy:0 "Ход противника — думает…"
notice.battle_started:0 "Бой начат — атакующий ходит первым"
notice.hour_complete:0 "Час {n} завершён — нажмите [Синхр. с HOI4] на правой панели"
