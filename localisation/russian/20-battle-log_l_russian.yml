# Battle log message templates (GameController.log lines). Placeholders: {name}, {n}, {q}, {r}, …

# ── Deployment / command feedback ──
log.checkpoint.restarted:0 "Бой начат заново (контрольная точка: начало боя)"
log.checkpoint.rollback:0 "Возврат к последней синхронизации"
log.deploy.cannot_start:0 "Нельзя начать: не развёрнуто подразделений ({n}) — разверните их из боевого порядка или нажмите «Авторазвёртывание»"
notice.deploy.undeployed:0 "Не развёрнуто подразделений: {n} — сначала разверните их"
log.deploy.cannot_start_error:0 "Нельзя начать: {err}"
log.deploy.battle_started:0 "Бой начат — атакующий ходит первым"
log.deploy.auto_deploy:0 "Авторазвёртывание — штаб разместил подразделений: {n}"
notice.deploy.auto_deployed:0 "Автоматически развёрнуто подразделений: {n}"
log.deploy.auto_deploy_empty:0 "Авторазвёртывание: нечего больше размещать"
oob.unattached:0 "(не приписано)"
oob.all:0 "Все"
log.deploy.recall:0 "Отзыв: {n} батальон(а) ({label}) возвращено в боевой порядок"
notice.deploy.recalled:0 "{n} батальон(а) отозвано в боевой порядок"
log.deploy.impassable:0 "Невозможно развернуть на непроходимой/водной местности"
log.deploy.sector_empty:0 "Сектор пуст — в прямоугольнике нет гексов зоны развёртывания"
log.deploy.sector_too_large:0 "Сектор слишком велик ({n} гексов) — прямоугольник должен оставаться в пределах зоны развёртывания"
log.deploy.sector_placed:0 "{label}: {n} батальон(а) развёрнуто в секторе"
log.deploy.sector_no_room:0 "{label}: в секторе не осталось места (ещё {waiting} ждут развёртывания)"
notice.deploy.ally_sector_set:0 "{div}: предложение по развёртыванию записано — союзный штаб развернёт в начале боя"

# ── Sync / battle end ──
log.sync.losses:0 "СИНХР. час {hour} → потери: свои — орг. {p_org}, числ. {p_str} | противник — орг. {e_org}, числ. {e_str}"
log.sync.summary:0 "Передано в HOI4 (ваши потери) — орг. {p_org} | числ. {p_str}\nПотери противника — орг. {e_org} | числ. {e_str}"
log.sync.rejected:0 "Синхронизация отклонена сессией: {err}"
log.sync.applied:0 "Результаты боя применены. Окно можно закрыть."
log.sync.stalled:0 "Синхронизация не подтверждена — часы HOI4 не продвинулись; ожидается ваше решение"
log.sync.stall_retry:0 "Повтор успешен — часы HOI4 продвинулись"
log.sync.stall_cancel:0 "Подтверждение синхронизации отменено — бой продолжается (часы HOI4 отстают)"
log.desync.hour:0 "СИНХРОНИЗАЦИЯ НЕВОЗМОЖНА — часы HOI4 больше не совпадают с этим боем (ожидалось {expected}, прочитано {found}); выберите: завершить бой или продолжить без синхронизации"
log.desync.tag:0 "СИНХРОНИЗАЦИЯ НЕВОЗМОЖНА — в сохранении играют за {found}, а этот бой принадлежит {expected}; выберите: завершить бой или продолжить без синхронизации"
log.desync.entered:0 "РЕЖИМ РАССИНХРОНИЗАЦИИ — больше нет хода часов, обратной записи урона и синхронизации состава; любой выход лишь очищает замороженное состояние HOI4"
log.desync.ended:0 "Тактический бой завершён (защита от рассинхронизации) — очистка HOI4 отправлена, результаты отброшены"
log.desync.cleanup_exit:0 "Несинхронизированный бой закрыт — только очистка HOI4, результаты не записаны"
log.end.rejected:0 "Завершение боя отклонено сессией: {err}"

