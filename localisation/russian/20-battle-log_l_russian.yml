log.order.emplace:0 "{name} разворачивает орудия (действие израсходовано)"
log.order.limber:0 "{name} сворачивает орудия (действие израсходовано)"
log.order.retreat:0 "{name} начинает боевой отход"
log.order.stand_by:0 "{name} в ожидании — приказы отменены"
log.order.stand_by_div:0 "{name} в ожидании — приказы отменены, возвращён под управление ИИ дивизии"
log.order.take_manual:0 "{name} под ручным управлением"
log.order.take_manual_div:0 "{name} под ручным управлением — ИИ дивизии больше не управляет"
log.order.emplaced_move:0 "{name} развёрнут — сначала свернуть орудия"
log.order.already_acted:0 "{name} уже действовал на этом ходе"
log.order.attack_superseded:0 "{name} — прежний приказ на атаку отменён"
log.move.eta:0 "{name} → ({q}, {r}) — прибытие через {n} ход(а)"
log.order.desc_assault:0 "штурм: {target}"
log.order.desc_direct_fire:0 "прямой огонь: {target}"
log.order.desc_fire_mission:0 "огневая задача по ({q}, {r})"
log.order.registered:0 "{name} → {desc} (приказ принят)"
log.order.rejected:0 "{name}: {reason}"

