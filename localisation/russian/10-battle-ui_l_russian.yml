battle.tooltip.auto.fast:0 "Экспериментальный режим, ещё незрелый (пометка «тест» исчезнет, когда он устаканится): автоигра в стиле RTS одной кнопкой — все три автоматики ниже работают сами в темпе, заданном ползунком скорости, сводки боя не всплывают (исходы по-прежнему попадают в журнал боя), а синхронизации на границе часа срабатывают сами. Space — пауза/продолжение: на паузе доской можно полноценно пользоваться для приказов. Снятие галочки восстанавливает ваши прежние настройки ниже."
battle.tooltip.auto.speed:0 "Насколько быстро катится режим RTS: 1.0× — темп по умолчанию; выше — ускорить, ниже — замедлить (ожидания автозавершения хода и синхронизации на границе часа масштабируются вместе)."
battle.tooltip.auto.skip_quiet:0 "Ходы без расчёта огня и штурма завершаются сами — чистое движение и ходы без действий катятся дальше. Ход, в котором был бой, приостанавливает продвижение (эта галочка остаётся включённой); завершите тот ход вручную один раз — и пропуск возобновится. Останавливается с уведомлением после 12 ходов без движения и боя."
battle.tooltip.auto.skip_reports:0 "Окно боевой сводки каждого хода закрывается само после задержки ниже, кнопка «Продолжить» не нужна. Сводки конца боя всегда ждут ручного закрытия."
battle.tooltip.auto.auto_sync:0 "Синхронизация на границе часа выполняется сама; сводка закрывается после собственной задержки (при включённом автопродвижении её закрытие возобновляет пропуск)."
battle.tooltip.auto.report_close_secs:0 "Как долго боевая сводка остаётся на экране, прежде чем закрыться сама."
battle.tooltip.auto.sync_close_secs:0 "Как долго сводка синхронизации остаётся на экране, прежде чем закрыться сама."
battle.manual.keep:0 "Сохранять управление"
battle.tooltip.manual.keep.checked:0 "Сохранять вручную: после завершения ручного приказа (прибытие / разрешение атаки) батальон не возвращается автоматически — он остаётся под ручным управлением, ИИ дивизии никогда его не забирает, и он не участвует в планировании приказов дивизии, пока его не вернуть щелчком ПКМ по самому батальону."
battle.tooltip.manual.keep.unchecked:0 "Возврат по завершении (по умолчанию): после завершения ручного приказа батальон возвращается в свою дивизию при смене хода и снова включается в планирование приказов дивизии; журнал боя объявляет о возврате."
battle.notice.auto.fuse:0 "{n} ход(а) без движения и боя — автопродвижение остановлено"
battle.notice.auto.paused:0 "Автоигра на паузе (Space — продолжить)"
battle.notice.auto.resumed:0 "Автоигра возобновлена"
battle.notice.advance_all.none:0 "Наступать всем: ни одна дивизия не ждёт приказа"

