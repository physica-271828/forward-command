# ── Combat tactics (tactical-ai tactic.rs; English fallback = name()/description()/counter_hint()) ──
tactic.blitz.name:0 "Блицкриг"
tactic.blitz.desc:0 "Глубокий прорыв: бронетехника устремляется на узком участке, обходя опорные пункты; мотопехота следует за ней и расширяет пролом."
tactic.blitz.hint:0 "Уязвима перед: Эластичная оборона"
tactic.elastic_defense.name:0 "Эластичная оборона"
tactic.elastic_defense.desc:0 "Затягивание и сохранение сил: отходит под атакой и контратакует только изолированные подразделения противника."
tactic.elastic_defense.hint:0 "Сильна против: Блицкриг"
tactic.overwhelming_fire.name:0 "Подавляющий огонь"
tactic.overwhelming_fire.desc:0 "Война на истощение: вся артиллерия сосредоточена на слабейшем гексе, пока линия пехоты держится."
tactic.overwhelming_fire.hint:0 "Сильна против: Массированная атака"
tactic.infiltration_assault.name:0 "Проникающий штурм"
tactic.infiltration_assault.desc:0 "Использование брешей: разведка прощупывает фланги; пехота сосредотачивается на слабо удерживаемых гексах, избегая сильных позиций."
tactic.infiltration_assault.hint:0 "Прямой контры нет"
tactic.mass_charge.name:0 "Массированная атака"
tactic.mass_charge.desc:0 "Полный фронтальный штурм: вся пехота наступает вместе, не более одного гекса за ход. Высокая терпимость к потерям."
tactic.mass_charge.hint:0 "Уязвима перед: Подавляющий огонь"
tactic.guerrilla_tactics.name:0 "Партизанская тактика"
tactic.guerrilla_tactics.desc:0 "Удар и отход: нанести удар и отцепиться — никогда не заканчивает ход в соседстве с противником."
tactic.guerrilla_tactics.hint:0 "Прямой контры нет"
tactic.tactical_withdrawal.name:0 "Тактический отход"
tactic.tactical_withdrawal.desc:0 "Планомерный отход: отходит на один гекс за ход в сторону тыла под прикрытием арьергарда."
tactic.tactical_withdrawal.hint:0 "Сильна против: Окружение"
tactic.encirclement.name:0 "Окружение"
tactic.encirclement.desc:0 "Клещи: бронетехника охватывает оба фланга, пока пехота сковывает центр."
tactic.encirclement.hint:0 "Уязвима перед: Тактический отход"
tactic.default.name:0 "Стандартная"
tactic.default.desc:0 "Держать позицию и вступать в бой с ближайшим противником; повреждённые подразделения отводятся в тыл."
tactic.default.hint:0 "Контры нет"
tactic.counterattack.name:0 "Контратака"
tactic.counterattack.desc:0 "Контрнаступление: держит линию, но наносит тяжёлый удар по изолированному или разбитому противнику и удерживает позиции."
tactic.counterattack.hint:0 "Сильна против: Штурм"
tactic.ambush.name:0 "Засада"
tactic.ambush.desc:0 "Засада: никогда не движется, таится в укрытии и бьёт только по противнику, вошедшему в соседний гекс."
tactic.ambush.hint:0 "Сильна против: Шок"
tactic.river_defense.name:0 "Оборона реки"
tactic.river_defense.desc:0 "Рубеж по реке: держит берег любой ценой — без отступления; противник, застигнутый посреди переправы, получает двойной урон."
tactic.river_defense.hint:0 "Сильна против: Форсирование реки"
tactic.urban_defense.name:0 "Оборона города"
tactic.urban_defense.desc:0 "Уличные бои: гарнизонит город, никогда его не покидает и сражается с каждым вошедшим противником."
tactic.urban_defense.hint:0 "Прямой контры нет"
tactic.delay.name:0 "Сдерживание"
tactic.delay.desc:0 "Подвижное сдерживание: держит противника в контактной полосе 2–3 гекса постоянным огнём и ступенчатым сопротивлением."
tactic.delay.hint:0 "Уязвима перед: Шок"
tactic.assault.name:0 "Штурм"
tactic.assault.desc:0 "Стандартный штурм: артиллерия обрабатывает слабейший гекс, линия пехоты наступает в ногу и штурмует при контакте."
tactic.assault.hint:0 "Уязвима перед: Контратака"
tactic.river_assault.name:0 "Форсирование реки"
tactic.river_assault.desc:0 "Форсирование реки: артиллерия утюжит брод, пехота прорывается через реку и закрепляется на дальнем берегу."
tactic.river_assault.hint:0 "Уязвима перед: Оборона реки"

