menu.about.disclaimer:0 "Отказ от ответственности"
menu.about.disclaimer.text:0 "Это программное обеспечение — бесплатный личный любительский проект. Оно не аффилировано с Paradox Interactive, не является официальным продуктом и не одобрено и не разрешено ею — Hearts of Iron IV и все её материалы остаются собственностью Paradox Interactive.\nПрограмма лишь читает журнал игры и ваши файлы сохранений, записывая результаты обратно имитацией нажатий клавиш в консоли игры. Никакого доступа к сети, никакого сбора данных. Антивирусное ПО может помечать такое поведение как подозрительное — перед использованием добавьте исключение.\nПроверено, что инъекция не оставляет следов, но всё равно делайте резервные копии сохранений перед игрой. Используйте на свой страх и риск: программное обеспечение предоставляется \"как есть\", без каких-либо гарантий."

