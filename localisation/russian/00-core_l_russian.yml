menu.settings.msaa:0 "Сглаживание MSAA"
menu.settings.msaa.off:0 "Выкл."
menu.settings.shadow:0 "Тени"
menu.settings.shadow.off:0 "Выкл."
menu.settings.shadow.low:0 "Низкие"
menu.settings.shadow.high:0 "Высокие"
menu.settings.max_fps:0 "Ограничение частоты кадров"
menu.settings.max_fps.uncapped:0 "Без ограничения"
menu.settings.menu_fps:0 "Частота кадров меню"
menu.settings.low_power:0 "Снижение частоты кадров в простое (бои)"
menu.settings.render_scale:0 "Масштаб рендеринга"
menu.tooltip.msaa:0 "4×/2×/выкл. — более низкая ступень освобождает видеопамять на дисплеях с высоким разрешением; изменения применяются сразу, в том числе в боях (Esc → Настройки)"
menu.tooltip.shadow:0 "Выкл. / Низкие (1024, упрощённая выборка) / Высокие (2048) — «Выкл.» полностью пропускает проход теней; «Низкие» также вдвое снижает стоимость отрисовки прохода теней. Меню рендерит тени не выше «Низких» (его сцена неподвижна)"
menu.tooltip.render_scale:0 "100%/85%/70%/50% — ниже 100% 3D-сцена рендерится в меньшем разрешении и растягивается на окно: самый большой прирост частоты кадров на слабых видеокартах ценой небольшой потери чёткости. Изменения применяются сразу, в том числе в боях (Esc → Настройки)"
menu.tooltip.max_fps:0 "Ограничивает рендеринг окна боя. 60 кадров более чем достаточно для пошаговой стратегии, а на дисплеях с высокой частотой обновления заметно снижает нагрузку на видеокарту; «Без ограничения» — рендеринг на полной скорости. У меню собственное ограничение ниже"
menu.tooltip.menu_fps:0 "Ограничивает вращающийся фон главного меню — медленную панораму (один оборот ≈140 с), которая при 24–30 кадрах/с выглядит так же. Меню не снижает частоту кадров в простое, так что это его единственный регулятор нагрузки на видеокарту (≈30% загрузки видеокарты при 60)"
menu.tooltip.low_power:0 "Окна боёв перерисовываются по вводу и работают на ~10 кадрах/с в простое — освобождает видеокарту для параллельно запущенной HOI4"
menu.settings.writeback:0 "Обратная запись потерь"
menu.settings.writeback.org_str:0 "Вкл. (орг. + числ., с точностью до провинции)"
menu.settings.writeback.off:0 "Выкл."
menu.settings.writeback.desc:0 "HOI4 не умеет выделять конкретную дивизию: точность обратной записи — провинция. Потери обороняющегося ложатся точно на спорную провинцию (её обороняет каждая находящаяся там дивизия); потери атакующего применяются по каждой провинции-источнику и могут немного задеть находящиеся там дивизии, не участвовавшие в бою."
menu.settings.writeback.detail.org_str:0 "Обратно записываются и организация, и численность: потери обороняющегося привязаны точно к спорной провинции, потери численности атакующего распределяются по всем дивизиям в каждой провинции-источнике (не участвовавшим может немного достаться)."
menu.settings.writeback.detail.off:0 "Ничего не записывается обратно — тактический бой не затрагивает вашу кампанию в HOI4 (режим песочницы)."
menu.tooltip.writeback:0 "Как потери тактического боя записываются обратно в HOI4"
menu.settings.manual_cmd:0 "Возврат из ручного управления"
menu.settings.manual_cmd.auto:0 "Возвращать по завершении (по умолчанию)"
menu.settings.manual_cmd.keep:0 "Оставлять в ручном до ожидания"
menu.tooltip.manual_cmd:0 "Кто командует батальоном после завершения его ручного приказа. «Возвращать по завершении» (по умолчанию): при следующей смене хода батальон возвращается в свою дивизию (об этом объявляется в журнале боя) и вновь участвует в планировании приказов дивизии. «Оставлять в ручном до ожидания»: батальон остаётся в ручном управлении — ИИ дивизии никогда не забирает его обратно, и он не участвует в планировании приказов дивизии, — пока его не переведут в ожидание щелчком правой кнопки мыши по самому батальону. Переключается прямо в бою (флажок под кнопкой «Завершить ход»); изменения применяются немедленно и сохраняются."
menu.settings.diag:0 "Экспортировать диагностический пакет"
menu.settings.diag.include_save:0 "Включить последнее сохранение"
menu.settings.diag.done:0 "Диагностический пакет записан: {path}"
menu.settings.diag.failed:0 "Ошибка экспорта: {error}"
menu.tooltip.diag:0 "Zip-архив для отчётов об ошибках одним щелчком: crash.log + журнал инъекций + settings.json + конец game.log (+ последнее сохранение, если отмечено). Записывается рядом с exe. В нём есть локальные пути — а при отметке и ваше сохранение, — так что загляните внутрь, прежде чем делиться"
menu.tooltip.diag.include_save:0 "Приложить новейшее сохранение .hoi4 — необходимо для отчётов об ошибках ожидания боя и инъекций. Сохранения велики: экспорт занимает несколько секунд"

