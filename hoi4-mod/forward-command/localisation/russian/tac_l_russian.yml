l_russian:
 forward_command_decisions: "Forward Command"
 forward_command_decisions_desc: "Возьмите тактическое командование сражениями на фронте в свои руки. Нажмите решение «Вступить в тактический бой», затем щёлкните подсвеченный прифронтовой регион на карте (ESC отменяет выбор); сражение будет разрешено побатальонно во внешней военной игре.\n\n§RВНИМАНИЕ: перед использованием этих решений запустите внешнюю программу forward-command.exe — иначе сражение останется замороженным.§!"
 tactical_command_entry: "Вступить в тактический бой в §Y[FROM.GetName]§!"
 tactical_command_entry_desc: "Выберите прифронтовой регион (свой или вражеский) и возьмите тактическое командование тамошним сражением в свои руки. Внешняя военная игра откроется и разрешит его побатальонно (Forward Command)."
 tactical_scan: "Поиск боёв, доступных для командования"
 tactical_scan_desc: "Внешняя программа перечислит все сражения с участием ваших войск (фронты, высадки, десант, пограничные войны, добровольческие корпуса). Подходящие регионы подсветятся на карте — подсветка сбрасывается при следующем дневном обновлении, сканируйте повторно для повторной публикации — затем выберите один через «Вступить в тактический бой»."
 tactical_force_exit: "Принудительный выход из тактического режима"
 tactical_force_exit_desc: "Немедленно прервать режим тактического командования. Несинхронизированные тактические результаты будут потеряны."
 tac_quiet.1.t: "В этом регионе нет боя"
 tac_quiet.1.d: "В выбранном регионе сейчас нет идущего сражения."
 tac_quiet.1.o: "Понятно"
 tac_abort.1.t: "Тактический бой прерван"
 tac_abort.1.d: "Вы вручную вышли из тактического боя."
 tac_abort.1.o: "OK"
 tac_complete.99.t: "Тактический бой завершён"
 tac_complete.99.d: "Тактический бой завершён."
 tac_complete.99.o: "OK"
 tac_freeze: "Идёт тактический бой"
 tac_watchdog.1.t: "Тактический режим автоматически сброшен"
 tac_watchdog.1.d: "От внешней программы (forward-command.exe) не поступило подтверждения синхронизации, поэтому замороженное сражение освобождено и сброшено.\n\nЭтот мод работает в паре с внешней программой: запустите forward-command.exe перед использованием решений Forward Command. Программа загружается отдельно: GitHub Releases или файлы группы (ссылки в описании в Мастерской)."
 tac_watchdog.1.o: "OK"
 tac_version.1.t: "Forward Command — программа устарела"
 tac_version.1.d: "Внешняя программа, ведущая этот бой, устарела: загруженный мод новее программы. Загрузите свежий ForwardCommand_v*.zip и замените forward-command.exe — сам мод переустанавливать не нужно."
 tac_version.1.o: "Понятно"

 tac_scan.1.t: "Нет ответа от внешней программы"
 tac_scan.1.d: "На это сканирование не поступило ответа от внешней программы (forward-command.exe), поэтому ни один регион не был подсвечен.\n\nРаботающая программа ставит игру на паузу в момент сканирования — если игра не встала на паузу, программа не запущена. Запустите forward-command.exe и сканируйте снова. Программа загружается отдельно: GitHub Releases или файлы группы (ссылки в описании в Мастерской)."
 tac_scan.1.o: "Понятно"
 tac_scan.2.t: "Сейчас нет боёв, доступных для командования"
 tac_scan.2.d: "Внешняя программа ответила на сканирование: сейчас нет боёв, доступных для командования (ни на фронтах, ни в высадках, десанте, пограничных войнах, ни среди добровольцев нет идущих сражений).\n\nКогда сражение начнётся, просто сканируйте снова."
 tac_scan.2.o: "Понятно"

 tac_notice.1.t: "Forward Command включён"
 tac_notice.1.d: "Этот мод работает в паре с внешней программой forward-command.exe: запустите её перед игрой (программа загружается отдельно: GitHub Releases или файлы группы, ссылки в описании в Мастерской).\n\nКогда в прифронтовом регионе начнётся сражение, входите в тактический бой на гексах через решения «Forward Command»."
 tac_notice.1.o: "Понятно"
