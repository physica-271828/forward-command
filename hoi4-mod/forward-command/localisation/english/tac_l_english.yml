l_english:
 forward_command_decisions: "Forward Command"
 forward_command_decisions_desc: "Take direct tactical command of engagements on the frontier. Click 'Enter Tactical Battle', then click a highlighted frontier state on the map (ESC cancels the selection); the engagement is resolved battalion by battalion in the external wargame program.\n\n§RNOTE: start the external program forward-command.exe before using these decisions — otherwise the battle stays frozen.§!"
 tactical_command_entry: "Enter Tactical Battle in §Y[FROM.GetName]§!"
 tactical_command_entry_desc: "Pick a frontier state (yours or the enemy's) and take direct tactical command of the engagement there. The external wargame program opens and resolves it battalion by battalion (Forward Command)."
 tactical_scan: "Scan for Commandable Battles"
 tactical_scan_desc: "Have the external program list every battle your forces take part in (fronts, landings, airdrops, border wars, volunteer fights). Eligible states light up on the map — they expire at the next daily refresh, so scan again to republish — then pick one via Enter Tactical Battle."
 tactical_force_exit: "Force Exit Tactical Mode"
 tactical_force_exit_desc: "Abort tactical command mode immediately. Any unsynchronized tactical results are lost."
 tac_quiet.1.t: "No Running Battle in This State"
 tac_quiet.1.d: "The picked state has no running battle at the moment."
 tac_quiet.1.o: "Understood"
 tac_abort.1.t: "Tactical Battle Exited"
 tac_abort.1.d: "You manually exited the tactical battle."
 tac_abort.1.o: "OK"
 tac_complete.99.t: "Tactical Battle Ended"
 tac_complete.99.d: "The tactical battle has ended."
 tac_complete.99.o: "OK"
 tac_freeze: "Tactical Battle in Progress"
 tac_watchdog.1.t: "Tactical Mode Auto-Reset"
 tac_watchdog.1.d: "No sync acknowledgement from the external program (forward-command.exe) was detected, so the frozen battle has been released and reset.\n\nThis mod works together with the external program: start forward-command.exe before using the Forward Command decisions. The program is a separate download: GitHub Releases or the group file share (links in the Workshop description)."
 tac_watchdog.1.o: "OK"
 tac_version.1.t: "Forward Command — program out of date"
 tac_version.1.d: "The external program driving this battle is out of date: the loaded mod is newer than the program. Download the latest ForwardCommand_v*.zip and replace forward-command.exe — the mod itself needs no reinstall."
 tac_version.1.o: "Understood"

 tac_scan.1.t: "No Answer from the External Program"
 tac_scan.1.d: "This scan received no answer from the external program (forward-command.exe), so no state was highlighted.\n\nA working program pauses the game the moment you scan — if the game did not pause, the program is not running. Start forward-command.exe and scan again. The program is a separate download: GitHub Releases or the group file share (links in the Workshop description)."
 tac_scan.1.o: "Understood"
 tac_scan.2.t: "No Commandable Battles Right Now"
 tac_scan.2.d: "The external program answered this scan: there are no battles you can command at the moment (nothing running on the fronts, in landings, airdrops, border wars or volunteer fights).\n\nScan again once an engagement starts."
 tac_scan.2.o: "Understood"

 tac_notice.1.t: "Forward Command Active"
 tac_notice.1.d: "This mod works together with the external program forward-command.exe — start it before you play (the program is a separate download: GitHub Releases or the group file share — links in the Workshop description).\n\nWhen divisions engage in a frontier state, use the Forward Command decisions to fight the battle on a hex-grid board."
 tac_notice.1.o: "Understood"
