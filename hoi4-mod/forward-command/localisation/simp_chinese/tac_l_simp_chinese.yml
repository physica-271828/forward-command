l_simp_chinese:
 forward_command_decisions: "前敌指挥"
 forward_command_decisions_desc: "对前线交战进行直接战术指挥。点击「进入战术战斗」决议后，在地图上点选高亮的前线州（ESC 可取消选择），即可在外部战棋程序中逐营解决战斗。\n\n§R注意：需先启动外部程序 forward-command.exe 再使用本类决议，否则战斗将保持冻结。§!"
 tactical_command_entry: "在§Y[FROM.GetName]§!进入战术战斗"
 tactical_command_entry_desc: "选择一个前线州（我方或敌方均可），直接指挥那里的战斗。外部战棋程序将打开，并逐营解决这场交战（前敌指挥）。"
 tactical_force_exit: "强制退出战术模式"
 tactical_force_exit_desc: "立即中止战术指挥模式。任何未同步的战术结果将丢失。"
 tac_quiet.1.t: "当前州无战斗"
 tac_quiet.1.d: "所选州当前没有正在进行的战斗。"
 tac_quiet.1.o: "确认"
 tac_abort.1.t: "战术战斗已退出"
 tac_abort.1.d: "您已手动退出战术战斗。"
 tac_abort.1.o: "确认"
 tac_complete.99.t: "战术战斗结束"
 tac_complete.99.d: "本次战术战斗已结束。"
 tac_complete.99.o: "确认"
 tac_freeze: "战术推演进行中"
 tac_watchdog.1.t: "战术模式已自动重置"
 tac_watchdog.1.d: "未检测到外部程序（forward-command.exe）的同步应答，战术战斗已解除冻结并复位。\n\n本 mod 需配合外部程序使用：请先启动 forward-command.exe 再使用「战术指挥」决议。获取方式见创意工坊页面。"
 tac_watchdog.1.o: "确认"

 tac_notice.1.t: "前敌指挥已启用"
 tac_notice.1.d: "本 mod 需配合外部程序 forward-command.exe 使用：游玩前请先启动它（见压缩包/创意工坊页面说明）。\n\n前线州发生交战时，通过「战术指挥」决议进入六角格战术战斗。"
 tac_notice.1.o: "知道了"