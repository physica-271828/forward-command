l_simp_chinese:
 forward_command_decisions: "前敌指挥"
 forward_command_decisions_desc: "对前线交战实施直接战术指挥。点击「进入战术战斗」决议后，在地图上点选高亮的前线州（ESC 可取消选择），即可在外部战棋程序中逐营解决战斗。\n\n§R注意：使用本类决议前，请先启动外部程序 forward-command.exe；否则战斗将保持冻结。§!"
 tactical_command_entry: "在§Y[FROM.GetName]§!进入战术战斗"
 tactical_command_entry_desc: "点选一个前线州（我方或敌方均可），对该处的战斗实施直接指挥。外部战棋程序将随之打开，逐营解决这场交战（前敌指挥）。"
 tactical_scan: "扫描可指挥的战斗"
 tactical_scan_desc: "由外部程序检索我方当前参与的全部战斗（前线、登陆、空降、边境战争、志愿军参战），并在对应州点亮地图标记。标记于次日刷新后失效，重新扫描即可再次点亮；随后经「进入战术战斗」选取目标州。"
 tactical_force_exit: "强制退出战术模式"
 tactical_force_exit_desc: "立即中止战术指挥模式。任何未同步的战术结果将丢失。"
 tac_quiet.1.t: "当前州无战斗"
 tac_quiet.1.d: "所选州当前没有正在进行的战斗。"
 tac_quiet.1.o: "确认"
 tac_abort.1.t: "战术战斗已退出"
 tac_abort.1.d: "您已手动退出战术战斗。"
 tac_abort.1.o: "确认"
 tac_complete.99.t: "战术战斗结束"
 tac_complete.99.d: "本次战术战斗已结束。"
 tac_complete.99.o: "确认"
 tac_freeze: "战术推演进行中"
 tac_watchdog.1.t: "战术模式已自动重置"
 tac_watchdog.1.d: "未检测到外部程序（forward-command.exe）的同步应答，战术战斗已解除冻结并复位。\n\n本 mod 需配合外部程序使用：请先启动 forward-command.exe，再使用「前敌指挥」决议。程序需另行下载：GitHub Releases 或群文件（链接见工坊页说明）。"
 tac_watchdog.1.o: "确认"
 tac_version.1.t: "前敌指挥 — 程序版本过旧"
 tac_version.1.d: "驱动本次战术战斗的外部程序版本过旧：已加载的 mod 比程序新。请下载最新的 ForwardCommand_v*.zip 并替换 forward-command.exe——mod 本身无需重装。"
 tac_version.1.o: "知道了"

 tac_scan.1.t: "未检测到外部程序应答"
 tac_scan.1.d: "本次扫描未收到外部程序（forward-command.exe）的任何应答，地图上没有任何州被点亮。\n\n程序正常工作时，点击扫描会先自动暂停游戏——若游戏没有暂停，说明外部程序未在运行。请启动 forward-command.exe 后重新扫描。程序需另行下载：GitHub Releases 或群文件（链接见工坊页说明）。"
 tac_scan.1.o: "知道了"
 tac_scan.2.t: "当前没有可指挥的战斗"
 tac_scan.2.d: "外部程序已响应本次扫描：当前没有可指挥的战斗（前线、登陆、空降、边境战争、志愿军参战均无进行中的交战）。\n\n出现交战时重新扫描即可。"
 tac_scan.2.o: "知道了"

 tac_notice.1.t: "前敌指挥已启用"
 tac_notice.1.d: "本 mod 需配合外部程序 forward-command.exe 使用：游玩前请先启动它（程序需另行下载：GitHub Releases 或群文件，链接见工坊页说明）。\n\n前线州发生交战时，通过「前敌指挥」决议进入六角格战术战斗。"
 tac_notice.1.o: "知道了"
